{% extends "base.html" %}
{% block title %}Editar Profissional — Integra{% endblock %}
{% block page_title %}Editar Profissional{% endblock %}

{% block content %}
<div class="form-wrapper">
  {% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}

  <form method="post" action="/professionals/{{ professional.id }}/edit">
    <div class="form-group">
      <label for="name">Nome</label>
      <input type="text" id="name" name="name" class="form-control" value="{{ professional.name }}" required />
    </div>
    <div class="form-group">
      <label for="surname">Sobrenome</label>
      <input type="text" id="surname" name="surname" class="form-control" value="{{ professional.surname }}" required />
    </div>
    <div class="form-group">
      <label for="cpf">CPF <span style="color:var(--danger)">*</span></label>
      <input type="text" id="cpf" name="cpf" class="form-control" value="{{ professional.cpf or '' }}" required placeholder="000.000.000-00" maxlength="14" />
    </div>
    <div class="form-group">
      <label for="specialization">Especialização</label>
      <input type="text" id="specialization" name="specialization" class="form-control" value="{{ professional.specialization }}" required />
    </div>
    <div class="form-group">
      <label for="registration">Registro no Conselho</label>
      <input type="text" id="registration" name="registration" class="form-control" value="{{ professional.registration or '' }}" />
    </div>
    <div class="form-group">
      <label for="phone">Telefone</label>
      <input type="tel" id="phone" name="phone" class="form-control" value="{{ professional.phone or '' }}" />
    </div>
    <div class="form-group">
      <label for="email">E-mail</label>
      <input type="email" id="email" name="email" class="form-control" value="{{ professional.email or '' }}" />
    </div>
    <div class="form-group">
      <label for="user_id">Conta de Usuário (opcional)</label>
      <select id="user_id" name="user_id" class="form-control">
        <option value="">— Nenhuma —</option>
        {% for u in users %}
        <option value="{{ u.id }}" {% if u.id == professional.user_id %}selected{% endif %}>{{ u.full_name }} ({{ u.email }})</option>
        {% endfor %}
      </select>
    </div>
    <div class="form-group">
      <label>
        <input type="checkbox" name="is_active" {% if professional.is_active %}checked{% endif %} /> Ativo
      </label>
    </div>
    <div class="form-actions">
      <button type="submit" class="btn btn-primary">Salvar Alterações</button>
      <a href="/professionals/{{ professional.id }}" class="btn btn-secondary">Cancelar</a>
    </div>
  </form>
</div>
{% endblock %}
