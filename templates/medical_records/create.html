{% extends "base.html" %}
{% block title %}Novo Prontuário — Integra{% endblock %}
{% block page_title %}Novo Prontuário{% endblock %}

{% block content %}
<div class="form-wrapper">
  {% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}

  <form method="post" action="/medical-records/new">
    <div class="form-group">
      <label for="patient_id">Paciente <span style="color:var(--danger)">*</span></label>
      <select id="patient_id" name="patient_id" class="form-control" required>
        <option value="">Selecione o paciente…</option>
        {% for p in patients %}
        <option value="{{ p.id }}" {% if selected_patient_id == p.id %}selected{% endif %}>{{ p.full_name }}</option>
        {% endfor %}
      </select>
    </div>
    {% if professionals %}
    <div class="form-group">
      <label for="professional_id">Profissional <span style="color:var(--danger)">*</span></label>
      <select id="professional_id" name="professional_id" class="form-control" required>
        <option value="">Selecione o profissional…</option>
        {% for prof in professionals %}
        <option value="{{ prof.id }}" {% if selected_professional_id == prof.id %}selected{% endif %}>{{ prof.name }} {{ prof.surname }}</option>
        {% endfor %}
      </select>
    </div>
    {% endif %}
    <div class="form-group">
      <label for="appointment_id">Consulta Vinculada (opcional)</label>
      <input type="number" id="appointment_id" name="appointment_id" class="form-control" placeholder="ID do agendamento" />
    </div>
    <div class="form-group">
      <label for="title">Título <span style="color:var(--danger)">*</span></label>
      <input type="text" id="title" name="title" class="form-control" required placeholder="ex.: Avaliação inicial" />
    </div>
    <div class="form-group">
      <label for="content">Notas Clínicas <span style="color:var(--danger)">*</span></label>
      <textarea id="content" name="content" class="form-control" required style="min-height:200px;"></textarea>
    </div>
    <div class="form-actions">
      <button type="submit" class="btn btn-primary">Salvar Prontuário</button>
      <a href="/medical-records" class="btn btn-secondary">Cancelar</a>
    </div>
  </form>
</div>
{% endblock %}
