{% extends "base.html" %}
{% block title %}Editar Prontuário — Integra{% endblock %}
{% block page_title %}Editar Prontuário{% endblock %}

{% block content %}
<div class="form-wrapper">
  {% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}

  <form method="post" action="/medical-records/{{ record.id }}/edit">
    <div class="form-group">
      <label for="title">Título</label>
      <input type="text" id="title" name="title" class="form-control" value="{{ record.title }}" required />
    </div>
    <div class="form-group">
      <label for="content">Notas Clínicas</label>
      <textarea id="content" name="content" class="form-control" required style="min-height:200px;">{{ record.content }}</textarea>
    </div>
    <div class="form-actions">
      <button type="submit" class="btn btn-primary">Salvar Alterações</button>
      <a href="/medical-records/{{ record.id }}" class="btn btn-secondary">Cancelar</a>
    </div>
  </form>
</div>
{% endblock %}
