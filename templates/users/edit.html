{% extends "base.html" %}
{% block title %}Editar Usuário — Integra{% endblock %}
{% block page_title %}Editar Usuário{% endblock %}

{% block content %}
<div class="form-wrapper">
  {% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}

  <form method="post" action="/users/{{ target.id }}/edit">
    <div class="form-group">
      <label for="name">Nome</label>
      <input type="text" id="name" name="name" class="form-control" value="{{ target.name }}" required />
    </div>
    <div class="form-group">
      <label for="surname">Sobrenome</label>
      <input type="text" id="surname" name="surname" class="form-control" value="{{ target.surname }}" required />
    </div>
    <div class="form-group">
      <label for="email">E-mail</label>
      <input type="email" id="email" name="email" class="form-control" value="{{ target.email }}" required />
    </div>
    <div class="form-group">
      <label for="role">Função</label>
      <select id="role" name="role" class="form-control">
        {% for r in roles %}
        <option value="{{ r.value }}" {% if r == target.role %}selected{% endif %}>{{ r.value | role_pt }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="form-group">
      <label>
        <input type="checkbox" name="is_active" {% if target.is_active %}checked{% endif %} /> Ativo
      </label>
    </div>
    <div class="form-group">
      <label for="new_password">Redefinir Senha (opcional)</label>
      <input type="password" id="new_password" name="new_password" class="form-control" minlength="8" placeholder="Deixe em branco para manter a senha atual" />
      <small>Se preenchido, o usuário precisará trocar a senha no próximo login.</small>
    </div>
    <div class="form-actions">
      <button type="submit" class="btn btn-primary">Salvar Alterações</button>
      <a href="/users" class="btn btn-secondary">Cancelar</a>
    </div>
  </form>
</div>
{% endblock %}
