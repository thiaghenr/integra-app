{% extends "base.html" %}
{% block title %}Novo Usuário — Integra{% endblock %}
{% block page_title %}Novo Usuário{% endblock %}

{% block content %}
<div class="form-wrapper">
  {% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}

  {% if clinics %}
  <div class="form-group" style="margin-bottom:24px;">
    <label for="clinic_filter">Clínica</label>
    <select id="clinic_filter" class="form-control"
            onchange="window.location='/users/new?selected_clinic_id=' + (this.value || '')">
      <option value="">Selecione a clínica…</option>
      {% for c in clinics %}
      <option value="{{ c.id }}" {% if selected_clinic_id == c.id %}selected{% endif %}>{{ c.name }}</option>
      {% endfor %}
    </select>
  </div>
  {% endif %}

  <form method="post" action="/users/new">
    {% if clinics %}
    <input type="hidden" name="clinic_id" value="{{ selected_clinic_id or '' }}" />
    {% endif %}
    <div class="form-group">
      <label for="name">Nome</label>
      <input type="text" id="name" name="name" class="form-control" required />
    </div>
    <div class="form-group">
      <label for="surname">Sobrenome</label>
      <input type="text" id="surname" name="surname" class="form-control" required />
    </div>
    <div class="form-group">
      <label for="email">E-mail</label>
      <input type="email" id="email" name="email" class="form-control" required />
    </div>
    <div class="form-group">
      <label for="password">Senha Inicial</label>
      <input type="password" id="password" name="password" class="form-control" required minlength="8" />
    </div>
    <div class="form-group">
      <label for="phone">Telefone (opcional)</label>
      <input type="tel" id="phone" name="phone" class="form-control" />
    </div>
    <div class="form-group">
      <label for="role">Função</label>
      <select id="role" name="role" class="form-control">
        {% for r in roles %}
        <option value="{{ r.value }}">{{ r.value | role_pt }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="form-actions">
      <button type="submit" class="btn btn-primary">Criar Usuário</button>
      <a href="/users" class="btn btn-secondary">Cancelar</a>
    </div>
  </form>
</div>
{% endblock %}
