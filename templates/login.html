<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Entrar — Integra</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/css/style.css" />
  <style>
    body { display: flex; align-items: center; justify-content: center; min-height: 100vh; background: #F4F6F8; }
    .login-card { background: #fff; border: 1px solid var(--border); border-radius: 10px; padding: 40px; width: 100%; max-width: 400px; box-shadow: 0 2px 12px rgba(0,0,0,.06); }
    .login-logo  { text-align: center; margin-bottom: 28px; }
    .login-logo .brand-name { font-size: 26px; font-weight: 600; color: var(--brand); }
    .login-logo p { color: var(--muted); font-size: 13px; margin-top: 4px; }
    .login-card h2 { font-size: 17px; font-weight: 600; margin-bottom: 20px; }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="login-logo">
      <div class="brand-name">Integra</div>
      <p>Sistema de Gestão de Clínicas</p>
    </div>
    <h2>Acesse sua conta</h2>

    {% if error %}
    <div class="alert alert-danger">{{ error }}</div>
    {% endif %}

    <form method="post" action="/login">
      <div class="form-group">
        <label for="email">E-mail</label>
        <input type="email" id="email" name="email" class="form-control" required autofocus />
      </div>
      <div class="form-group">
        <label for="password">Senha</label>
        <input type="password" id="password" name="password" class="form-control" required />
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;margin-top:8px;">Entrar</button>
    </form>
  </div>
</body>
</html>
