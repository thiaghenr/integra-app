{% extends "base.html" %}
{% block title %}Editar Paciente — Integra{% endblock %}
{% block page_title %}Editar Paciente{% endblock %}

{% block content %}
<div class="form-wrapper">
  {% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}

  <form method="post" action="/patients/{{ patient.id }}/edit">
    <div class="form-group">
      <label for="name">Nome <span style="color:var(--danger)">*</span></label>
      <input type="text" id="name" name="name" class="form-control" value="{{ patient.name }}" required />
    </div>
    <div class="form-group">
      <label for="surname">Sobrenome <span style="color:var(--danger)">*</span></label>
      <input type="text" id="surname" name="surname" class="form-control" value="{{ patient.surname }}" required />
    </div>
    <div class="form-group">
      <label for="cpf">CPF</label>
      <input type="text" id="cpf" name="cpf" class="form-control" value="{{ patient.cpf or '' }}" />
    </div>
    <div class="form-group">
      <label for="date_of_birth">Data de Nascimento</label>
      <input type="date" id="date_of_birth" name="date_of_birth" class="form-control" value="{{ patient.date_of_birth or '' }}" />
    </div>
    <div class="form-group">
      <label for="phone">Telefone</label>
      <input type="tel" id="phone" name="phone" class="form-control" value="{{ patient.phone or '' }}" />
    </div>
    <div class="form-group">
      <label for="email">E-mail</label>
      <input type="email" id="email" name="email" class="form-control" value="{{ patient.email or '' }}" />
    </div>
    <div class="form-group">
      <label for="address">Endereço</label>
      <input type="text" id="address" name="address" class="form-control" value="{{ patient.address or '' }}" />
    </div>
    <div class="form-group">
      <label for="notes">Observações</label>
      <textarea id="notes" name="notes" class="form-control">{{ patient.notes or '' }}</textarea>
    </div>
    <div class="form-group">
      <label for="user_id">Conta de Usuário (opcional)</label>
      <select id="user_id" name="user_id" class="form-control">
        <option value="">— Nenhuma —</option>
        {% for u in users %}
        <option value="{{ u.id }}" {% if u.id == patient.user_id %}selected{% endif %}>{{ u.full_name }} ({{ u.email }})</option>
        {% endfor %}
      </select>
    </div>
    <div class="form-actions">
      <button type="submit" class="btn btn-primary">Salvar Alterações</button>
      <a href="/patients/{{ patient.id }}" class="btn btn-secondary">Cancelar</a>
    </div>
  </form>
</div>
{% endblock %}
