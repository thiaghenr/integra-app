{% extends "base.html" %}
{% block title %}Editar Clínica — Integra{% endblock %}
{% block page_title %}Editar Clínica{% endblock %}

{% block content %}
<div class="form-wrapper">
  {% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}

  <form method="post" action="/clinics/{{ clinic.id }}/edit">
    <div class="form-group">
      <label for="name">Nome da Clínica <span style="color:var(--danger)">*</span></label>
      <input type="text" id="name" name="name" class="form-control" value="{{ clinic.name }}" required />
    </div>
    <div class="form-group">
      <label for="slug">Slug <span style="color:var(--danger)">*</span></label>
      <input type="text" id="slug" name="slug" class="form-control" value="{{ clinic.slug }}" required
             pattern="[a-z0-9\-]+" title="Apenas letras minúsculas, números e hifens" />
    </div>
    <div class="form-group">
      <label for="phone">Telefone</label>
      <input type="tel" id="phone" name="phone" class="form-control" value="{{ clinic.phone or '' }}" />
    </div>
    <div class="form-group">
      <label for="address">Endereço</label>
      <input type="text" id="address" name="address" class="form-control" value="{{ clinic.address or '' }}" />
    </div>
    <div class="form-group">
      <label>
        <input type="checkbox" name="is_active" {% if clinic.is_active %}checked{% endif %} /> Ativo
      </label>
    </div>
    <div class="form-actions">
      <button type="submit" class="btn btn-primary">Salvar Alterações</button>
      <a href="/clinics" class="btn btn-secondary">Cancelar</a>
    </div>
  </form>
</div>
{% endblock %}
