{% extends "base.html" %}
{% block title %}Nova Meta — Integra{% endblock %}
{% block page_title %}Nova Meta{% endblock %}

{% block content %}
<div class="form-wrapper">
  {% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}

  <form method="post" action="/goals/new">
    <div class="form-group">
      <label for="patient_id">Paciente <span style="color:var(--danger)">*</span></label>
      <select id="patient_id" name="patient_id" class="form-control" required>
        <option value="">Selecione o paciente…</option>
        {% for p in patients %}
        <option value="{{ p.id }}" {% if selected_patient_id == p.id %}selected{% endif %}>{{ p.full_name }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="form-group">
      <label for="title">Título <span style="color:var(--danger)">*</span></label>
      <input type="text" id="title" name="title" class="form-control" required placeholder="ex.: Reduzir crises de ansiedade" />
    </div>
    <div class="form-group">
      <label for="description">Descrição</label>
      <textarea id="description" name="description" class="form-control"></textarea>
    </div>
    <div class="form-group">
      <label for="start_date">Data de Início</label>
      <input type="date" id="start_date" name="start_date" class="form-control" />
    </div>
    <div class="form-group">
      <label for="end_date">Data de Fim</label>
      <input type="date" id="end_date" name="end_date" class="form-control" />
    </div>
    <div class="form-actions">
      <button type="submit" class="btn btn-primary">Cadastrar Meta</button>
      <a href="/goals" class="btn btn-secondary">Cancelar</a>
    </div>
  </form>
</div>
{% endblock %}
