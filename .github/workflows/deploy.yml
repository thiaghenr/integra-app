name: Build & Deploy

# Manual dispatch only for now — this repo doesn't yet have an established
# branch-per-environment convention, so promotion to dev/staging/prod is an
# explicit choice rather than automatic on push. Revisit once a branching
# strategy and hosting target are decided.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        required: true
        options:
          - dev
          - staging
          - prod

env:
  REGISTRY: ghcr.io

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Lowercase image name
        id: image
        run: |
          IMAGE="${REGISTRY}/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.image }}:${{ inputs.environment }}-${{ github.sha }}
            ${{ steps.image.outputs.image }}:${{ inputs.environment }}-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  migrate:
    needs: build-and-push
    runs-on: ubuntu-latest
    # Selecting the GitHub Environment here is what makes ${{ secrets.* }} below
    # resolve to that environment's own secrets (configured under
    # Settings → Environments → dev/staging/prod in this repo).
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install .

      - name: Apply migrations against ${{ inputs.environment }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: alembic upgrade head

  # No further "deploy to a running server" step yet — there's no hosting
  # target defined for this project (ECS/Fargate, a VPS, Fly.io, etc.). Once
  # one is chosen, add a job here that pulls
  # ${{ needs.build-and-push.outputs.image }}:${{ inputs.environment }}-${{ github.sha }}
  # and rolls it out, using that environment's remaining secrets
  # (SECRET_KEY, CHATBOT_API_KEY, AWS_*, etc.).
