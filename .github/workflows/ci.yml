name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install lint dependencies
        run: pip install ".[lint]"

      - name: ruff check
        run: ruff check .

      - name: ruff format --check
        run: ruff format --check .

      - name: mypy
        run: mypy .

  migrations:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: integra
          POSTGRES_PASSWORD: integra_pass
          POSTGRES_DB: integra_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U integra -d integra_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://integra:integra_pass@localhost:5432/integra_ci
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install .

      - name: Verify migrations apply cleanly from scratch
        run: alembic upgrade head

  test:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: integra
          POSTGRES_PASSWORD: integra_pass
          POSTGRES_DB: integra_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U integra -d integra_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://integra:integra_pass@localhost:5432/integra_ci
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install test dependencies
        run: pip install ".[test]"

      - name: Run test pyramid (unit + integration + e2e)
        run: pytest -v
