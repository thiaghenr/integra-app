exclude: ^\.claude/

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: mixed-line-ending
      - id: check-case-conflict
        exclude: ^migrations/versions/

  # ruff/mypy run from the project's own ./venv (language: system) instead of
  # pre-commit's isolated per-hook environments, so they always match the
  # exact versions pinned in requirements-dev.txt. Set up the venv with:
  #   python3 -m venv venv && venv/bin/pip install -r requirements-dev.txt
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: venv/bin/ruff check --fix
        language: system
        types: [python]
        exclude: ^migrations/versions/

      - id: ruff-format
        name: ruff format
        entry: venv/bin/ruff format
        language: system
        types: [python]
        exclude: ^migrations/versions/

      - id: mypy
        name: mypy
        entry: venv/bin/mypy
        language: system
        types: [python]
        exclude: ^migrations/
