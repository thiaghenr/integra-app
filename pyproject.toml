[project]
name = "integra"
version = "1.0.0"
description = "Multidisciplinary clinic scheduling system"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "jinja2>=3.1.4",
    "sqlmodel>=0.0.21",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "python-multipart>=0.0.9",
    "itsdangerous>=2.2.0",
    "bcrypt>=4.1.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "email-validator>=2.1.0",
    "aioboto3>=13.0.0",
    "greenlet>=3.0.0",
    "PyJWT>=2.8.0",
    "httpx>=0.27.0",
    "google-api-python-client>=2.140.0",
    "google-auth>=2.34.0",
    "bleach[css]>=6.1.0",
    "beautifulsoup4>=4.12.0",
    "prometheus-client>=0.20.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
]
lint = [
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "types-aioboto3>=13.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 120
# *.md/.claude excluded because ruff format's docstring-code formatting also reaches
# into fenced code blocks in standalone Markdown files — we only want real source touched.
extend-exclude = ["migrations/versions", "*.md", ".claude"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = [
    "B008",   # FastAPI's Depends()/Form()/Query() default-arg pattern is intentional
    "UP042",  # class Foo(str, Enum) vs StrEnum — behavior differs subtly, not a mechanical rename
    "UP046",  # Generic[T] vs PEP 695 syntax — stylistic, not worth a mixed-style migration here
]

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
# infra/cdk has its own app.py, which mypy treats as the same top-level "app"
# module as the FastAPI app/ package when scanning the whole repo -- the CDK
# app is checked separately (see infra/cdk's own venv/tooling), not as part
# of this app's type checking.
exclude = ["migrations/versions", "infra/"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
disable_error_code = [
    # SQLModel PK fields are typed `int | None` (to allow pre-insert instances) even
    # though every DB-fetched instance always has the field populated.
    "arg-type",
    # FastAPI's documented `app.openapi = custom_openapi` pattern reassigns a bound method.
    "method-assign",
    # pydantic's `@computed_field` + `@property` combo is intentional and supported at runtime.
    "prop-decorator",
]

[[tool.mypy.overrides]]
# Every service class exposes a `.list()` method, which makes mypy misresolve `list[...]`
# annotations elsewhere in the same class to that method instead of the builtin generic —
# even with `from __future__ import annotations`. Purely a static-analysis quirk (no runtime
# effect); revisit if these methods are ever renamed.
module = "app.backend.services.*"
disable_error_code = ["valid-type", "misc", "attr-defined"]

[[tool.mypy.overrides]]
# SQLModel's class-level column access (e.g. `Patient.phone.in_(...)`) is typed using the
# column's Python type (e.g. `str | None`), not SQLAlchemy's `InstrumentedAttribute` — there's
# no official SQLModel mypy plugin to bridge this, so the repository layer's query-builder
# calls (`.in_()`, `.ilike()`, `.desc()`, `.join()`) false-positive constantly. Every other
# layer (services, routers, schemas) keeps full checking.
module = "app.backend.repositories.*"
disable_error_code = ["union-attr", "attr-defined", "arg-type"]
